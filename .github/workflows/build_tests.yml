name: Run UnitTests
on:
  push:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      install_extras: "test"
      # without a test_path the reusable workflow only builds and installs, so
      # no test in this repository has ever run in CI
      test_path: "test"
